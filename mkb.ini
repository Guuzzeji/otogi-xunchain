# Keyboard and mouse for Otogi (the toolkit's src/input/mkb_input.h).
# Used only when no XInput pad is plugged in. RECOMP_MKB=0 turns it off.
# bind.<PAD>=<INPUT>,<INPUT>  -- no spaces in a value.
# The mouse is locked and hidden while the window has focus; F9 releases it.
#
# Pad layout: left stick move, right stick camera, A jump, X attack,
# Y strong attack, B magic, RT dash, LT lock-on, START pause.

# The mouse turns the camera (right stick).
sens=1.0
full=8
invert_y=0

bind.MOVE_UP=W
bind.MOVE_DOWN=S
bind.MOVE_LEFT=A
bind.MOVE_RIGHT=D
bind.A=SPACE,ENTER
bind.X=MOUSE1,J
bind.Y=MOUSE2,K
bind.B=E,MOUSE3,BACKSPACE,L
bind.RT=SHIFT
bind.LT=Q,CTRL
bind.LS=F
bind.RS=Z
bind.WHITE=1
bind.BLACK=2

# Menus
bind.DPAD_UP=UP
bind.DPAD_DOWN=DOWN
bind.DPAD_LEFT=LEFT
bind.DPAD_RIGHT=RIGHT
bind.START=ESCAPE,P
bind.BACK=TAB

# Releases otogi-xunchain.exe (the launcher) on GitHub, with the changelog section as notes.
# Automatic: merging a PR into main bumps the version by the box ticked under "Release"
# in the PR body (major, minor, patch or none), turns the changelog's "Unreleased"
# section into that version, commits and tags it, then releases. "none" releases nothing.
# By hand: Actions > Release > Run workflow does the same with a chosen bump;
# "none" there releases the current version as it is (its section must already exist).
name: Release

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write

# Back-to-back merges release one after another, each from the main the last one left.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # pull_request_target (not pull_request) so merged fork PRs get a write token too.
    # Safe: it checks out main, never the PR's code, and reads the body only through env.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Version and changelog
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "${{ github.event_name }}" != workflow_dispatch ]; then
            boxes=$(tr -d '\r' <<< "$BODY" | grep -oiE '^\s*- \[x\] (major|minor|patch|none)' || true)
            [ "$(grep -c . <<< "$boxes")" = 1 ] || { echo "::error::Tick exactly one box under Release in the PR"; exit 1; }
            BUMP=$(grep -oiE '[a-z]+$' <<< "$boxes" | tr A-Z a-z)
            [ "$BUMP" = none ] && { echo "Release box: none, nothing to release"; exit 0; }
          fi
          cur=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon)
          IFS=. read -r major minor patch <<< "$cur"
          case "$BUMP" in
            major) new="$((major + 1)).0.0" ;;
            minor) new="$major.$((minor + 1)).0" ;;
            patch) new="$major.$minor.$((patch + 1))" ;;
            none)  new="$cur" ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "::error::v$new is already released"; exit 1
          fi
          if [ "$new" != "$cur" ]; then
            unreleased=$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
            if ! grep -q '[^[:space:]]' <<< "$unreleased"; then
              echo "::error::Nothing under ## [Unreleased] in CHANGELOG.md"; exit 1
            fi
            sed -i "s/^\( *\.version = \)\"$cur\",/\1\"$new\",/" build.zig.zon
            sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$new] - $(date -u +%F)/" CHANGELOG.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$new"
          fi
          awk -v v="$new" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no notes for $new"; exit 1; }
          git tag "v$new"
          echo "version=$new" >> "$GITHUB_OUTPUT"

      # After the commit: setup embeds `git archive HEAD` and the new version.
      - if: steps.version.outputs.version
        run: zig build setup
      - if: steps.version.outputs.version
        run: zig build test

      # ponytail: a PR merged during the build makes this push fail (not fast-forward).
      # Re-run the job: nothing was pushed, so it bumps again from the new main. Rebase here if that gets common.
      - name: Push and publish
        if: steps.version.outputs.version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.version.outputs.version }}"
          git push origin HEAD:main "$v"
          # The launcher updates itself from the asset named otogi-xunchain.exe (asset_name in setup/main.zig).
          gh release create "$v" zig-out/bin/otogi-xunchain.exe setup/assets/OFL-ShipporiMinchoB1.txt setup/assets/THIRD-PARTY-NOTICES.txt \
            --title "Otogi XUnchain $v" --notes-file notes.md

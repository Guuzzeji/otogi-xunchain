# Releases the launcher on GitHub, for Windows (otogi-xunchain.exe) and Linux
# (otogi-xunchain-linux-x86_64), with the changelog section as notes.
# By hand only: Actions > Release > Run workflow. Merging a PR releases nothing; its changes
# wait under "Unreleased" in the changelog until the next run, which turns that section into
# the new version, commits and tags it, then releases.
# Bump "auto" takes the biggest box ticked under "Release" (major > minor > patch) among PRs
# merged into main since the last tag; if none ticked one, nothing is released. A chosen bump
# overrides it; "none" releases the current version as it is (its section must already exist).
# The version commit and tag travel to the build jobs as a git bundle and are pushed only
# once both launchers built and passed the tests.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = biggest box ticked in PRs merged since the last release)
        type: choice
        options: [auto, patch, minor, major, none]
        default: auto

permissions:
  contents: write

# Back-to-back runs release one after another, each from the main the last one left.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Version and changelog
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BUMP" = auto ]; then
            last=$(git describe --tags --abbrev=0 --match 'v*')
            since=$(git log -1 --format=%cI "$last")
            bodies=$(gh pr list --state merged --base main --search "merged:>$since" --limit 200 --json body --jq '.[].body')
            boxes=$(tr -d '\r' <<< "$bodies" | grep -oiE '^\s*- \[x\] (major|minor|patch)' | tr A-Z a-z || true)
            case "$boxes" in
              *major*) BUMP=major ;;
              *minor*) BUMP=minor ;;
              *patch*) BUMP=patch ;;
              *) echo "Nothing to release: no PR merged since $last ticked major, minor or patch"; exit 0 ;;
            esac
            echo "Bump from PRs merged since $last: $BUMP"
          fi
          cur=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon)
          IFS=. read -r major minor patch <<< "$cur"
          case "$BUMP" in
            major) new="$((major + 1)).0.0" ;;
            minor) new="$major.$((minor + 1)).0" ;;
            patch) new="$major.$minor.$((patch + 1))" ;;
            none)  new="$cur" ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "::error::v$new is already released"; exit 1
          fi
          if [ "$new" != "$cur" ]; then
            unreleased=$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
            if ! grep -q '[^[:space:]]' <<< "$unreleased"; then
              echo "::error::Nothing under ## [Unreleased] in CHANGELOG.md"; exit 1
            fi
            sed -i "s/^\( *\.version = \)\"$cur\",/\1\"$new\",/" build.zig.zon
            sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$new] - $(date -u +%F)/" CHANGELOG.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$new"
          fi
          awk -v v="$new" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no notes for $new"; exit 1; }
          git tag "v$new"
          git bundle create release.bundle main "v$new"
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.version
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release.bundle
            notes.md

  # After the version commit: setup embeds `git archive HEAD` and the new version.
  windows:
    needs: version
    if: needs.version.outputs.version
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ../release
      - shell: bash
        run: |
          v="v${{ needs.version.outputs.version }}"
          git fetch ../release/release.bundle "refs/tags/$v:refs/tags/$v"
          git checkout -q "$v"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build setup
      - run: zig build test
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: zig-out/bin/otogi-xunchain.exe

  # Debian 13, as in ci.yml: the oldest common distro with SDL3, so the oldest glibc asked for.
  linux:
    needs: version
    if: needs.version.outputs.version
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates xz-utils libsdl3-dev libegl-dev libgles-dev
          git config --global --add safe.directory '*' # the checkout is not the container user's
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ../release
      - shell: bash
        run: |
          v="v${{ needs.version.outputs.version }}"
          git fetch ../release/release.bundle "refs/tags/$v:refs/tags/$v"
          git checkout -q "$v"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build setup
      - run: zig build test
      - run: mv zig-out/bin/otogi-xunchain zig-out/bin/otogi-xunchain-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: zig-out/bin/otogi-xunchain-linux-x86_64

  # ponytail: a PR merged during the builds makes this push fail (not fast-forward).
  # Re-run the workflow: nothing was pushed, so it bumps again from the new main. Rebase here if that gets common.
  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: ../out
      - name: Push and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ needs.version.outputs.version }}"
          out=../out
          git fetch "$out/release/release.bundle" "refs/tags/$v:refs/tags/$v"
          git push origin "$v^{commit}:refs/heads/main" "$v"
          # The launcher updates itself from the asset named for its OS (asset_name in setup/main.zig).
          gh release create "$v" "$out/windows/otogi-xunchain.exe" "$out/linux/otogi-xunchain-linux-x86_64" \
            setup/assets/OFL-ShipporiMinchoB1.txt setup/assets/THIRD-PARTY-NOTICES.txt \
            --title "Otogi XUnchain $v" --notes-file "$out/release/notes.md"

# Every push and pull request: the version has a changelog section, setup builds,
# the tests pass. The game itself needs the lifted C (from a disc), so CI builds
# only the launcher (otogi-xunchain.exe, and its Linux twin), which is what players download.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Changelog has a section for the version in build.zig.zon
        shell: bash
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon)
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }

      - run: zig build setup
      - run: zig build test

      - uses: actions/upload-artifact@v4
        with:
          name: otogi-xunchain
          path: zig-out/bin/otogi-xunchain.exe

  # Debian 13: the oldest common distro with SDL3 (3.2) and so the oldest glibc the
  # Linux launcher asks for. git before checkout: setup embeds `git archive HEAD`.
  linux:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates xz-utils libsdl3-dev libegl-dev libgles-dev
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build setup
      - run: zig build test
      - run: mv zig-out/bin/otogi-xunchain zig-out/bin/otogi-xunchain-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: otogi-xunchain-linux-x86_64
          path: zig-out/bin/otogi-xunchain-linux-x86_64

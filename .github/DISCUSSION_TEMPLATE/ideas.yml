body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would fix or make better for you.
    validations:
      required: true
  - type: textarea
    id: xbox
    attributes:
      label: How the Xbox version does it
      description: If it relates to the original game. Leave empty for PC-only ideas.

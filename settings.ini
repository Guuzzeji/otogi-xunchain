; Otogi XUnchain settings. Each line sets RECOMP_<KEY>; an environment variable
; of the same name wins over this file. Delete a line to use its default.

; 0 = a window, 1 = borderless (a window covering the screen), 2 = fullscreen
; (on top, minimized when you switch away). Alt+Enter switches in game.
window = 1

; Fullscreen only (window = 2): screen resolution such as 1920x1080. Empty =
; keep the desktop's.
resolution =

; Internal resolution: 1 = 640x480 (original) to 4.
scale = 2

; 1 = 16:9 widescreen, 0 = original 4:3.
widescreen = 1

; Frames shown per second. The game still runs at its own 30 steps a second;
; the frames in between are blended. 0 = the monitor's refresh rate (rounded
; down to a multiple of 30), 30 = off (the original frame rate).
framerate = 0

; 1 = wait for the monitor's refresh (no tearing), 0 = off.
vsync = 1

; Graphics backend: d3d11, vulkan or gl.
gfx = d3d11

; 1 = ground mist stays behind the ground (the game draws some of it over the
; ground in front), 0 = original.
mist_depth = 1

; Right stick: 1 = turns the view the modern way (right looks right, up looks
; up), 0 = the original, which orbits the camera (right turns the view left).
cam_invert = 1

; 1 = open the debug menu (render stats, cheats) at start. F1 toggles it anyway.
debug_menu = 0

; 1 = write otogi.log beside otogi.exe (send it with problem reports), 0 = off.
log = 1
